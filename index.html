<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PixelVault | Image Gallery</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1>PixelVault</h1>
      <p>Explore the world through images</p>
    </header>

    <!-- Category Filters -->
    <nav class="filters">
      <button class="filter-btn active" data-filter="all">All</button>

      <button class="filter-btn" data-filter="nature">Nature</button>

      <button class="filter-btn" data-filter="architecture">
        Architecture
      </button>

      <button class="filter-btn" data-filter="technology">Technology</button>

      <button class="filter-btn" data-filter="travel">Travel</button>
    </nav>

    <!-- Image Gallery -->
    <main class="gallery">
      <div class="gallery-item" data-category="nature">
        <img
          src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
          alt="Nature landscape"
        />
      </div>
      <div class="gallery-item" data-category="nature">
        <img
          src="https://picjumbo.com/wp-content/uploads/beautiful-nature-wallpaper-spring-flowers-mountain-sunset-free-image.jpg"
          alt="Forests"
        />
      </div>
      <div class="gallery-item" data-category="nature">
        <img
          src="https://static.vecteezy.com/system/resources/thumbnails/055/352/823/small/lake-and-mountain-nature-beautiful-photo.jpg"
          alt="Lake and mountains"
        />
      </div>
      <div class="gallery-item" data-category="nature">

      </div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox">
      <button class="close-btn">&times;</button>

      <button class="prev-btn">&#10094;</button>

      <img class="lightbox-image" src="" alt="" />

      <button class="next-btn">&#10095;</button>

      <p class="image-counter">1 / 4</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
